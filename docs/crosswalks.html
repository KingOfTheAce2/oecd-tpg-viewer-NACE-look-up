<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NACE and NAICS Side by Side</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div style="text-align: center; margin-bottom: 20px;">
    <a href="index.html" class="app-link">← Back to Main Menu</a>
  </div>


  <!-- CrosswalkView Component Container -->
  <div id="crosswalk-root"></div>

  <!-- Load and render the CrosswalkView component -->
  <script src="CrosswalkView.js"></script>
  <script>
    // Render the CrosswalkView React component
    const { createElement } = React;
    
    function App() {
      return createElement('div', null,
        createElement(CrosswalkView, null)
      );
    }
    
    // Render to DOM
    const container = document.getElementById('crosswalk-root');
    const root = ReactDOM.createRoot(container);
    root.render(createElement(App));
  </script>
</body>
</html>
